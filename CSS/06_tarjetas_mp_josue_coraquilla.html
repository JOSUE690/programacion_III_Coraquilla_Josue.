<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>06 MP - Tarjetas de Productos</title>
    <link rel="stylesheet" href="06_tarjetas_mp_josue_coraquilla.css">
</head>
<body>
    <main class="contenedor-tarjetas">
        <article class="tarjeta-movil">
            <span class="etiqueta">Nuevo</span>
            <h3>iPhone 15 128GB</h3>
            <p class="specs">Chip A16 Bionic • Cámara 48MP • USB-C</p>
            <p class="precio">$849.00</p>
            <button class="btn-comprar">Agregar al carrito</button>
        </article>

        <article class="tarjeta-movil">
            <span class="etiqueta oferta">Oferta</span>
            <h3>Samsung Galaxy A55 5G</h3>
            <p class="specs">256GB • 8GB RAM • Super AMOLED 120Hz</p>
            <p class="precio">$395.00</p>
            <button class="btn-comprar">Agregar al carrito</button>
        </article>
    </main>
</body>
</html>
