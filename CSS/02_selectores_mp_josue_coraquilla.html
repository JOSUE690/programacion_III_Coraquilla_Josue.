<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>02 MP - Selectores de Equipos</title>
    <link rel="stylesheet" href="02_selectores_mp_josue_coraquilla.css">
</head>
<body>
    <header id="encabezado-tienda">
        <h1>Inventario de Equipos Móviles</h1>
    </header>

    <section>
        <div class="equipo-card">
            <h3>iPhone 16 Pro Max</h3>
            <p class="precio">$1,299.00</p>
            <span data-estado="disponible">En Stock</span>
        </div>
        <div class="equipo-card oferta">
            <h3>Samsung Galaxy S25 Ultra</h3>
            <p class="precio">$1,180.00</p>
            <span data-estado="agotado">Última unidad</span>
        </div>
    </section>
</body>
</html>
