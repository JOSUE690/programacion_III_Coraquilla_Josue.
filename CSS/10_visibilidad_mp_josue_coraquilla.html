<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>10 MP - Visibilidad vs Display None</title>
    <link rel="stylesheet" href="10_visibilidad_mp_josue_coraquilla.css">
</head>
<body>
    <h2>Control de Visibilidad de Equipos</h2>

    <div class="item visible">1. Google Pixel 9 Pro — Visible en catálogo</div>
    <div class="item oculto-espacio">2. Equipo Reservado — Oculto con visibility: hidden (conserva su espacio)</div>
    <div class="item visible">3. Honor Magic 6 Pro — Visible en catálogo</div>
    <div class="item eliminado-flujo">4. Equipo Descontinuado — Oculto con display: none (no ocupa espacio)</div>
</body>
</html>
