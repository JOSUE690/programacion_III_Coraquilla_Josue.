<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>03 MP - Colores y Gamas de Celulares</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #eef2f5; }
        .caja { padding: 18px; margin-bottom: 12px; color: white; border-radius: 6px; font-weight: bold; }
        /* HEX */
        .gama-alta { background-color: #1e293b; }
        /* RGB */
        .gama-media { background-color: rgb(37, 99, 235); }
        /* RGBA con transparencia */
        .accesorios { background-color: rgba(16, 185, 129, 0.85); color: #064e3b; }
        /* HSL */
        .outlet { background-color: hsl(25, 95%, 53%); }
    </style>
</head>
<body>
    <h2>Categorías por Color — Venta de Equipos Móviles</h2>
    <div class="caja gama-alta">Gama Alta / Flagship (HEX: #1e293b)</div>
    <div class="caja gama-media">Gama Media-Alta 5G (RGB: 37, 99, 235)</div>
    <div class="caja accesorios">Accesorios Originales y Cargadores (RGBA: 0.85)</div>
    <div class="caja outlet">Equipos Open-Box / Seminuevos (HSL: 25, 95%, 53%)</div>
</body>
</html>
