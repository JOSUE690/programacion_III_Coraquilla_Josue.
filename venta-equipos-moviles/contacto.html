<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venta de Equipos Móviles - Contacto</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header>
        <h1>Contacto y Pedidos</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="equipos.html">Equipos</a></li>
                <li><a href="servicios.html">Servicios</a></li>
                <li><a href="multimedia.html">Multimedia</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Solicita tu Cotización</h2>
            <form action="#" method="post">
                <label for="nombre">Nombre Completo:</label><br>
                <input type="text" id="nombre" name="nombre" required><br><br>

                <label for="email">Correo Electrónico:</label><br>
                <input type="email" id="email" name="email" required><br><br>

                <label for="equipo">Equipo de Interés:</label><br>
                <select id="equipo" name="equipo">
                    <option value="iphone15">iPhone 15 Pro</option>
                    <option value="s24ultra">Samsung Galaxy S24 Ultra</option>
                    <option value="xiaomi14">Xiaomi 14 Ultra</option>
                </select><br><br>

                <label for="mensaje">Mensaje o Consulta:</label><br>
                <textarea id="mensaje" name="mensaje" rows="4" cols="50"></textarea><br><br>

                <button type="submit">Enviar Solicitud</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Venta de Equipos Móviles. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
