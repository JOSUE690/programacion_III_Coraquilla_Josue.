<!DOCTYPE html>

    <link rel="stylesheet" href="css/estilos.css">

<body>
    <header>
        <h1>Galería Multimedia</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="equipos.html">Equipos</a></li>
                <li><a href="servicios.html">Servicios</a></li>

        </nav>

    <main>
        <section>
            <h2>Demostración de Equipos Móviles</h2>
            
            <!-- Ejemplo de Galería de Imágenes -->
            <article>
                <h3>Imagen del Dispositivo</h3>
                <img src="imagenes/telefono-ejemplo.jpg" alt="Teléfono Móvil de Ejemplo" width="300">
            </article>

            <!-- Ejemplo de Reproductor de Audio -->
            <article>
                <h3>Audio Promocional</h3>
                <audio controls>
                    <source src="audios/promocion.mp3" type="audio/mpeg">
                    Tu navegador no soporta el elemento de audio.
                </audio>
            </article>

            <!-- Ejemplo de Reproductor de Video con Subtítulos -->
            <article>
                <h3>Reseña en Video</h3>
                <video width="400" controls>
                    <source src="videos/resena.mp4" type="video/mp4">
                    <track src="subtitulos/subtitulos-es.vtt" kind="subtitles" srclang="es" label="Español">
                    Tu navegador no soporta el elemento de video.
                </video>
            </article>
        </section>
    </main>
