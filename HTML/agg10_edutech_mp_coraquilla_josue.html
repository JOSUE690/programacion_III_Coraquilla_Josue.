<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduTech Pro - Formularios HTML</title>
</head>
<body>

    <header>
        <h1>EduTech Pro - Registro de Estudiantes</h1>
    </header>

    <main>
        <h2>Formulario de Inscripción al Curso</h2>
        
        <form action="/registro" method="post">
            <label for="nombre">Nombre Completo:</label><br>
            <input type="text" id="nombre" name="nombre" required><br><br>

            <label for="email">Correo Electrónico:</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <label for="curso">Seleccione el Módulo:</label><br>
            <select id="curso" name="curso">
                <option value="html">Fundamentos HTML</option>
                <option value="css">Diseño CSS</option>
                <option value="js">JavaScript Básico</option>
            </select><br><br>

            <button type="submit">Enviar Registro</button>
        </form>
    </main>

    <footer>
        <br>
        <p>&copy; 2026 EduTech Pro - Josué Coraquilla</p>
    </footer>

</body>
</html>
