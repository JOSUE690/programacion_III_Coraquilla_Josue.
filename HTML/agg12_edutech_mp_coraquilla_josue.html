<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduTech Pro - Multimedia Avanzada e Iframes</title>
</head>
<body>

    <header>
        <h1>EduTech Pro - Centro Multimedia</h1>
        <hr>
    </header>

    <main>
        <!-- Sección de Audio -->
        <section>
            <h2>Reproducción de Audio Educativo</h2>
            <audio id="podcast" src="music/02.mp3" controls preload="metadata">
                Tu navegador no soporta audio HTML5
            </audio>
        </section>

        <br>

        <!-- Sección de Video -->
        <section>
            <h2>Reproducción de Video Institucional</h2>
            <video src="videos/01.mp4" controls width="500" preload="metadata">
                Tu navegador no soporta video HTML5
            </video>
        </section>

        <br><hr>

        <!-- Sección de Iframes y Portales Externos -->
        <section>
            <h2>Portal Tecnológico Externo</h2>
            <iframe src="https://developer.mozilla.org/" width="600" height="350" title="MDN Web Docs" loading="lazy"></iframe>
        </section>

        <br>

        <section>
            <h2>Vista de Módulos (Iframe Interno)</h2>
            <iframe src="agg10_edutech_mp_coraquilla_josue.html" width="600" height="350" title="Formulario EduTech" loading="lazy"></iframe>
        </section>
    </main>

    <footer>
        <br><hr>
        <p>&copy; 2026 EduTech Pro - Elaborado por Josué Coraquilla</p>
    </footer>

</body>
</html>
