<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>07_imagenes.html</title>
</head>
<body>

    <h1>Utilización de la etiqueta de Imagen</h1>

    <!-- Imagen local directa y sin espacios conflictivos -->
<img src="imagenes/image.avif" alt="auto" width="300" height="350" loading="eager">
    <br><br>

    <!-- Otras imágenes de referencia -->
    <img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=500" alt="Referencia" width="500" height="350" loading="eager">

    <br><br>

    <!-- Texto de pie de foto -->
    <p><b>Maestro Yoda, integrante del Consejo Jedi</b></p>

    <!-- Logo de Star Wars con enlace -->
    <a href="https://es.wikipedia.org/wiki/Star_Wars" target="_blank">
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6c/Star_Wars_Logo.svg" alt="Star Wars Logo" width="150">
    </a>

</body>
</html>
