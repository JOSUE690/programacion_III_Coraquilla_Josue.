<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas</title>
</head>
<body>

    <h1>Tablas en Html 5</h1>

    <table border="1">
        <caption><b>Personajes Star Wars</b></caption>
        <thead>
            <tr>
                <th>Personaje</th>
                <th>Planeta</th>
                <th>Afiliación</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Luke Skywalker</td>
                <td>Tatooine</td>
                <td>Jedi</td>
            </tr>
            <tr>
                <td>Darth Vader</td>
                <td>Tatooine</td>
                <td>Sith</td>
            </tr>
            <tr>
                <td>Yoda</td>
                <td>Desconocido</td>
                <td>Jedi</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
